services:
  - type: web
    name: ios-messages-server
    env: node
    plan: free
    region: oregon
    healthCheckPath: /healthz
    buildCommand: "corepack enable && pnpm install --frozen-lockfile=false --prod=false && pnpm build"
    startCommand: "pnpm start"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ONAY_APP_TOKEN
        value: "" # set in Render dashboard
      - key: ONAY_DEVICE_ID
        value: ""
      - key: ONAY_PHONE_NUMBER
        value: ""
      - key: ONAY_PASSWORD
        value: ""
      - key: ONAY_PUSH_TOKEN
        value: ""
      - key: ONAY_BASE_URL
        value: "https://nwqsr0rz5earuiy2t8z8.tha.kz"
      - key: ONAY_OS
        value: "2"
      - key: ONAY_VERSION
        value: "3.2.1"
      - key: ONAY_USER_AGENT
        value: "Onay/3.2.1 (kz.onay.Onay; build:6; iOS 26.2.0) Alamofire/5.4.4"
      - key: ONAY_CITY_ID
        value: "1"
      - key: ONAY_VERBOSE_LOGS
        value: "false"
      - key: ONAY_REQUEST_TIMEOUT_MS
        value: "15000"
      - key: ONAY_PAN_CACHE_TTL_MS
        value: "300000"
      - key: ONAY_KEEPALIVE_MSECS
        value: "1000"
      - key: ONAY_MAX_SOCKETS
        value: "50"
      - key: SERVER_KEEPALIVE_TIMEOUT_MS
        value: "65000"
      - key: SERVER_HEADERS_TIMEOUT_MS
        value: "70000"
      - key: SERVER_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: SLOW_REQUEST_MS
        value: "1000"
      - key: PERF_LOGS
        value: "true"
      - key: PERF_INTERVAL_MS
        value: "60000"
      - key: PUBLIC_BASE_URL
        value: "https://android-messege.onrender.com"
